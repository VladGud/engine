name: CI (windows)
on: [push, pull_request]

jobs:
    msvc-openssl-fork-tls13:
        runs-on: windows-latest
        outputs:
            openssl-head: ${{ steps.openssl.outputs.head }}
        steps:
            - uses: actions/checkout@v2
            - uses: actions/checkout@v2
              with:
                  repository: VladGud/openssl
                  path: openssl
                  ref: add-gost-tls13
                  fetch-depth: 0
            - run: echo "head=$(git -C openssl describe --always --long)" >> $env:GITHUB_OUTPUT
              id: openssl
            - uses: actions/cache@v4
              id: cache
              with:
                  path: openssl/_dest
                  key: ${{ runner.os }}-openssl-fork-tls13-${{ steps.openssl.outputs.head }}
            - uses: ilammy/msvc-dev-cmd@v1
            - name: Build OpenSSL
              if: steps.cache.outputs.cache-hit != 'true'
              working-directory: openssl
              run: |
                  perl Configure no-makedepend no-tests no-asm VC-WIN64A
                  perl configdata.pm --dump
                  nmake /S build_libs build_programs
                  nmake /S install_sw DESTDIR=_dest

    msvc-provider-openssl-fork-tls13:
        needs: msvc-openssl-fork-tls13
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v2
              with:
                  submodules: true
            - uses: actions/cache@v4
              with:
                  path: openssl/_dest
                  key: ${{ runner.os }}-openssl-fork-tls13-${{ needs.msvc-openssl-fork-tls13.outputs.openssl-head }}
            - run: cmake -DOPENSSL_ROOT_DIR="openssl\_dest\Program Files\OpenSSL" -DOPENSSL_ENGINES_DIR=bin -DGOST_BUILD_ENGINE=OFF -DTLS13_PATCHED_OPENSSL=1 .
            - run: cmake --build .
            - name: Run tests
              run: |
                  $env:OPENSSL_ENGINES = "$pwd\bin\Debug"
                  $env:OPENSSL_MODULES = "$pwd\bin\Debug"
                  Copy-Item -Path "$pwd\openssl\_dest\Program Files\OpenSSL\bin\*.dll" -Destination "$pwd\bin\Debug"
                  ctest -C Debug --output-on-failure
